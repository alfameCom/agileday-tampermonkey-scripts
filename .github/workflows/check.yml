name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in *.user.js lib/*.js scripts/*.js; do node --check "$f"; done
      - name: No organisation-, customer- or person-specific data
        run: node scripts/check-generic.js
